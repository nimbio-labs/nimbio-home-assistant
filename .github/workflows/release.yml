name: Release

# Tag-driven release, the same shape the SDKs use (nimbio-python-community-api,
# nimbio-npm-community-api): push a `v*` tag and the release is cut for you.
#
# The artifact here is the GitHub Release itself, not a package on a registry.
# HACS installs this integration from git, and reads the version from
# custom_components/nimbio/manifest.json — NOT from the tag. That split is the
# whole reason this workflow exists: a tag and a manifest that disagree ship a
# release that HACS reports under the wrong version, and nothing else in the
# repo catches it. The guard job below fails the release instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release

jobs:
  guard:
    name: tag matches manifest + changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version and extract release notes
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          manifest=$(python3 -c \
            'import json;print(json.load(open("custom_components/nimbio/manifest.json"))["version"])')

          if [ "$manifest" != "$version" ]; then
            echo "::error::tag $tag says $version but manifest.json says $manifest."
            echo "Bump the manifest and re-tag — HACS reports the manifest version, so"
            echo "shipping this would put $manifest on users' systems under a $version tag."
            exit 1
          fi
          echo "manifest and tag agree on $version"

          # Pull this version's section out of the keep-a-changelog file: from
          # "## [x.y.z]" up to (not including) the next "## " heading.
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no content under '## [$version]'."
            echo "Every tag is a release to real HACS installations — it needs notes."
            exit 1
          fi

          { echo "$notes"; } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Re-run the gates on the tagged commit rather than trusting that the branch
  # was green when the tag was cut. Tags get moved and cut from the wrong
  # commit; this is cheap insurance against publishing an untested one.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          # Keep this floor in step with `requirements` in
          # custom_components/nimbio/manifest.json — same rule as test.yml.
          pip install pytest pytest-homeassistant-custom-component \
                      "nimbio-community-api>=0.3.0"
      - run: pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  release:
    name: create GitHub release
    needs: [guard, pytest, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Title is just the tag. Past releases carry a hand-written headline
      # ("v0.2.3 — debug logs no longer carry the raw event payload"), which is
      # editorial and not derivable from the changelog — edit the release title
      # afterwards if you want it. Change `--title` here, or add `--draft`, if
      # you would rather write the headline before it goes live.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
