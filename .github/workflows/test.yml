name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          # Keep this floor in step with `requirements` in
          # custom_components/nimbio/manifest.json — CI testing against an
          # older SDK than the integration declares is how a missing
          # `community.stream_events()` reaches users instead of a red build.
          pip install pytest pytest-homeassistant-custom-component \
                      "nimbio-community-api>=0.3.0"
      - name: Run tests
        run: pytest -q
